name: Setup Dependencies
description: Set up Go and download the independently published module graph

inputs:
  go-version:
    description: Go version to install
    default: '1.27.3'
  token:
    description: Retained for compatibility; public modules need no clone token
    required: false

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
    - name: Download published dependencies
      shell: bash
      env:
        GOWORK: 'off'
      run: go mod download
